<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .yellow {
            color: yellow;
        }

        .attention, span {
            background-color: yellow;
            color: white;
            font-size: 30px;
        }

        .bolder {
            font-weight: 800;
        }
    </style>
</head>
<body>
    <h1>Advanced selectors</h1>
    <p>This is a paragraph</p>
    <p>This is a paragraph</p>
    <p class="yellow bolder">This is a paragraph</p>
    <p>This is a paragraph</p>
    <p class="attention">This is a paragraph</p>
    <p>This is a paragraph</p>
    <p class="bolder">This is a paragraph</p>
    <p>This is a paragraph</p>

    <p>This is a <span>Paragraph</span></p>
</body>
</html>
